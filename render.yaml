# Render Blueprint for the BioCurate backend (FastAPI + agents).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: biocurate-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run co-scientist serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CO_SCI_CORS_ORIGINS   # your Vercel URL, e.g. https://biocurate.vercel.app
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
